<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
  <link rel="manifest" href="manifest.json">
<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js');
  }
</script>
<title>Profit Tracker by Kisara Rajapaksha</title>
<style>
:root{
  --bg:#f4f6f8;--card:#fff;--tx:#12171f;--mu:#667085;--ac:#0f766e;--ac2:#e3f3f1;
  --gd:#15803d;--rd:#b91c1c;--am:#b45309;--bd:#e4e7ec;--sh:0 1px 3px rgba(16,24,40,.08);
  --purple:#7c3aed;--purple-bg:rgba(124,58,237,0.12);
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)
}
:root[data-theme="dark"]{
  --bg:#0d1117;--card:#161b22;--tx:#eef0f3;--mu:#98a2b3;--ac:#2dd4bf;--ac2:#12302d;
  --gd:#4ade80;--rd:#f87171;--am:#fbbf24;--bd:#262c36;--sh:none;
  --purple:#a78bfa;--purple-bg:rgba(167,139,250,0.18);
}
:root[data-theme="light"]{
  --bg:#f4f6f8;--card:#fff;--tx:#12171f;--mu:#667085;--ac:#0f766e;--ac2:#e3f3f1;
  --gd:#15803d;--rd:#b91c1c;--am:#b45309;--bd:#e4e7ec;--sh:0 1px 3px rgba(16,24,40,.08);
  --purple:#7c3aed;--purple-bg:rgba(124,58,237,0.12);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,Roboto,"Segoe UI",sans-serif}
body{display:flex;flex-direction:column}
header{padding:14px 16px 8px;display:flex;align-items:center;justify-content:space-between}
header h1{font-size:19px;margin:0;font-weight:700}
#main{flex:1;overflow-y:auto;padding:4px 14px 110px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:13px;margin-bottom:11px;box-shadow:var(--sh);transition:border .2s}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.grid .card{margin:0}
.l{color:var(--mu);font-size:12px;font-weight:500}.v{font-size:19px;font-weight:700;margin-top:2px}
.g{color:var(--gd)}.r{color:var(--rd)}.a{color:var(--am)}.p-color{color:var(--purple)}
.bar{height:6px;border-radius:99px;background:var(--bd);overflow:hidden;margin:7px 0}
.bar i{display:block;height:100%;background:var(--ac);border-radius:99px}
.row{display:flex;justify-content:space-between;align-items:center;gap:6px}
h2{font-size:13px;margin:14px 4px 6px;color:var(--mu);font-weight:600;text-transform:uppercase;letter-spacing:0.5px}
.pill{font-size:11px;padding:3px 8px;border-radius:99px;background:var(--ac2);color:var(--ac);font-weight:600;white-space:nowrap}
.pill.w{background:rgba(180,83,9,.14);color:var(--am)}.pill.d{background:rgba(185,28,28,.13);color:var(--rd)}
.pill.cash{background:rgba(21,128,61,.14);color:var(--gd)}
.pill.credit{background:rgba(180,83,9,.14);color:var(--am)}
.pill.special{background:var(--purple-bg);color:var(--purple);font-weight:700}
.pill.critical{background:var(--rd);color:#fff;font-weight:700;letter-spacing:0.3px}

.card.overdue-critical{
  border: 2px solid var(--rd) !important;
  background: rgba(185,28,28,0.04) !important;
  box-shadow: 0 0 10px rgba(185,28,28,0.18) !important;
}
:root[data-theme="dark"] .card.overdue-critical{
  background: rgba(248,113,113,0.08) !important;
}

nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:4}
nav button{flex:1;background:none;border:0;color:var(--mu);font:inherit;font-size:12px;padding:5px;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button b{font-size:19px;font-weight:400}nav button.on{color:var(--ac);font-weight:600}
nav button[data-t="special"].on{color:var(--purple)}

.fab-container{position:fixed;right:14px;bottom:calc(72px + env(safe-area-inset-bottom,0px));display:flex;gap:6px;z-index:5}
.fab{height:44px;padding:0 12px;border-radius:22px;border:0;background:var(--ac);color:#fff;font-size:13px;box-shadow:0 4px 14px rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center;font-weight:700;cursor:pointer}
.fab.p{background:#475569}
.fab.sp{background:var(--purple)}
input,textarea,select{width:100%;font:inherit;padding:9px 11px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx)}
label{display:block;font-size:11px;color:var(--mu);margin:8px 0 3px;font-weight:600}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.btn{border:0;border-radius:10px;padding:11px 14px;font:inherit;font-weight:600;background:var(--ac);color:#fff;width:100%;margin-top:12px;cursor:pointer}
.btn.s{background:var(--ac2);color:var(--ac)}.btn.x{background:rgba(185,28,28,.12);color:var(--rd)}
.btn.sp{background:var(--purple);color:#fff}
.btn-sm{border:0;border-radius:8px;padding:6px 10px;font:inherit;font-size:12px;font-weight:600;cursor:pointer}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;z-index:9}
.ov.on{display:flex}
.sheet{background:var(--card);width:100%;max-height:93%;overflow-y:auto;border-radius:20px 20px 0 0;padding:16px 14px calc(24px + env(safe-area-inset-bottom,0px))}
.sheet h3{margin:0 0 6px;font-size:17px}
.prev{background:var(--ac2);border-radius:10px;padding:9px 12px;margin-top:10px;font-size:13px}
.pay{display:flex;justify-content:space-between;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--bd)}
.pay button{background:none;border:0;color:var(--rd);font-size:17px;cursor:pointer}
.empty{text-align:center;color:var(--mu);padding:32px 10px}
.ib{background:none;border:1px solid var(--bd);color:var(--tx);border-radius:8px;padding:5px 9px;font:inherit;font-size:12px;cursor:pointer}
.subtag{display:inline-block;font-size:11px;font-family:monospace;background:rgba(0,0,0,0.06);padding:2px 5px;border-radius:5px;margin-left:4px}
:root[data-theme="dark"] .subtag{background:rgba(255,255,255,0.08)}
.item-box{border:1px dashed var(--bd);border-radius:10px;padding:10px;margin-bottom:8px;background:rgba(0,0,0,0.01)}
.date-header{font-size:12px;font-weight:700;color:var(--mu);text-transform:uppercase;margin:18px 4px 6px;display:flex;align-items:center;justify-content:space-between}
.product-chip{display:inline-flex;align-items:center;background:var(--ac2);color:var(--ac);padding:4px 9px;border-radius:99px;font-size:12px;margin:3px;font-weight:600}
.product-chip button{background:none;border:0;color:var(--rd);margin-left:6px;cursor:pointer;font-size:14px;padding:0}
.seg-control{display:flex;background:var(--bg);padding:4px;border-radius:10px;gap:4px;margin-bottom:12px;border:1px solid var(--bd)}
.seg-btn{flex:1;border:0;background:none;padding:7px;border-radius:7px;font-weight:600;font-size:13px;color:var(--mu);cursor:pointer}
.seg-btn.on{background:var(--card);color:var(--purple);box-shadow:var(--sh)}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body>

<datalist id="rx-products"></datalist>
<datalist id="rx-customers"></datalist>
<datalist id="rx-suppliers"></datalist>

<header>
  <div><h1 id="ttl">Profit Tracker</h1><div class="l">by Kisara Rajapaksha</div></div>
  <button class="ib" id="cs"></button>
</header>
<div id="main"></div>

<div class="fab-container">
  <button class="fab sp" onclick="specialActionPrompt()" title="Special Entry">+Special</button>
  <button class="fab p" onclick="purchaseForm()" title="Add Regular Purchase">+P</button>
  <button class="fab" onclick="saleForm()" title="Add Regular Sale">+S</button>
</div>

<nav>
  <button data-t="home"><b>▦</b>Summary</button>
  <button data-t="sales"><b>☰</b>Sales</button>
  <button data-t="purchases"><b>☷</b>Purchases</button>
  <button data-t="special"><b>★</b>Special</button>
  <button data-t="more"><b>⚙</b>Settings</button>
</nav>

<div class="ov" id="ov" onclick="if(event.target===this)closeS()"><div class="sheet" id="sh"></div></div>

<script>
const DEFAULT_PRODUCTS = [
  "Amentral", "Nitrocontin 2.6", "Nitrocontin 6.4", "Imodium", "Diamox",
  "Free Style", "Esparal", "Avomine", "Delay Spray", "Hisone", "Heparest",
  "Fucidin", "Dermi 5", "Arkamin", "Minoxidil", "Nicotex", "Atarax 25",
  "Axepta", "Hi sone 10", "Libriam", "Loperamide", "Hi sone 5",
  "Oselvir 75", "Oselvir 45", "Tramadol"
];

let S = {
  cur: 'Rs',
  theme: 'system',
  sales: [],
  purchases: [],
  specialSales: [],
  specialPurchases: [],
  products: [...DEFAULT_PRODUCTS],
  customers: [],
  suppliers: [],
  firebaseUrl: ''
};

let tab = 'home', q = '', qp = '', qsp = '', specialSubTab = 'sales';
let dbRef = null;
let isWriting = false;

try {
  const r = localStorage.getItem('pt1');
  if (r) {
    const parsed = JSON.parse(r);
    S = {...S, ...parsed};
    if (!S.sales) S.sales = [];
    if (!S.purchases) S.purchases = [];
    if (!S.specialSales) S.specialSales = [];
    if (!S.specialPurchases) S.specialPurchases = [];
    if (!S.products || !S.products.length) S.products = [...DEFAULT_PRODUCTS];
    if (!S.customers) S.customers = [];
    if (!S.suppliers) S.suppliers = [];
    if (!S.theme) S.theme = 'system';
  }
} catch(e) {}

[...(S.sales||[]), ...(S.specialSales||[])].forEach(s => {
  if (s.cust && !S.customers.includes(s.cust)) S.customers.push(s.cust);
});
[...(S.purchases||[]), ...(S.specialPurchases||[])].forEach(p => {
  if (p.supplier && !S.suppliers.includes(p.supplier)) S.suppliers.push(p.supplier);
});

const $ = s => document.querySelector(s);

function applyTheme(mode) {
  const root = document.documentElement;
  const themeMeta = document.querySelector('meta[name="theme-color"]');
  if (mode === 'dark') {
    root.setAttribute('data-theme', 'dark');
    if (themeMeta) themeMeta.setAttribute('content', '#0d1117');
  } else if (mode === 'light') {
    root.setAttribute('data-theme', 'light');
    if (themeMeta) themeMeta.setAttribute('content', '#0f766e');
  } else {
    const isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    root.setAttribute('data-theme', isDark ? 'dark' : 'light');
    if (themeMeta) themeMeta.setAttribute('content', isDark ? '#0d1117' : '#0f766e');
  }
}

if (window.matchMedia) {
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
    if (S.theme === 'system') applyTheme('system');
  });
}

function setTheme(mode) {
  S.theme = mode;
  applyTheme(mode);
  save();
}

function initFirebaseSync() {
  if (!S.firebaseUrl || typeof firebase === 'undefined') return;
  try {
    const cleanUrl = S.firebaseUrl.trim().replace(/\/+$/, '');
    if (!firebase.apps.length) {
      firebase.initializeApp({ databaseURL: cleanUrl });
    }
    dbRef = firebase.database().ref('tracker_data');

    dbRef.on('value', snapshot => {
      if (isWriting) return;
      const remoteData = snapshot.val();
      if (remoteData) {
        S.sales = Array.isArray(remoteData.sales) ? remoteData.sales : [];
        S.purchases = Array.isArray(remoteData.purchases) ? remoteData.purchases : [];
        S.specialSales = Array.isArray(remoteData.specialSales) ? remoteData.specialSales : [];
        S.specialPurchases = Array.isArray(remoteData.specialPurchases) ? remoteData.specialPurchases : [];
        if (Array.isArray(remoteData.products) && remoteData.products.length) S.products = remoteData.products;
        if (Array.isArray(remoteData.customers)) S.customers = remoteData.customers;
        if (Array.isArray(remoteData.suppliers)) S.suppliers = remoteData.suppliers;
        if (remoteData.cur) S.cur = remoteData.cur;
        
        try { localStorage.setItem('pt1', JSON.stringify(S)); } catch(e) {}
        render();
        updateDatalists();
      }
    });
  } catch(e) {
    console.warn('Firebase init error:', e);
  }
}

const save = async () => {
  try {
    localStorage.setItem('pt1', JSON.stringify(S));
  } catch(e) {}

  if (dbRef) {
    try {
      isWriting = true;
      await dbRef.set({
        cur: S.cur,
        sales: S.sales,
        purchases: S.purchases,
        specialSales: S.specialSales,
        specialPurchases: S.specialPurchases,
        products: S.products,
        customers: S.customers,
        suppliers: S.suppliers
      });
    } catch(err) {
      console.warn('Database write error:', err);
    } finally {
      setTimeout(() => { isWriting = false; }, 300);
    }
  }
  updateDatalists();
};

function updateDatalists() {
  const dlp = $('#rx-products');
  if (dlp) dlp.innerHTML = (S.products || []).map(p => `<option value="${esc(p)}">`).join('');
  const dlc = $('#rx-customers');
  if (dlc) dlc.innerHTML = (S.customers || []).map(c => `<option value="${esc(c)}">`).join('');
  const dls = $('#rx-suppliers');
  if (dls) dls.innerHTML = (S.suppliers || []).map(s => `<option value="${esc(s)}">`).join('');
}

const today = () => new Date().toISOString().slice(0, 10);
const money = n => S.cur + ' ' + (Math.round((Number(n)||0) * 100) / 100).toLocaleString(undefined, {maximumFractionDigits: 2});
const esc = t => String(t == null ? '' : t).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fd = d => new Date(d).toLocaleDateString(undefined, {day: 'numeric', month: 'short', year: 'numeric'});
const daysTo = d => Math.round((new Date(d) - new Date(today())) / 864e5);

function isTwoMonthsOverdue(itemDate, dueDate, rem) {
  if (rem <= 0.009) return false;
  const targetDate = dueDate || itemDate;
  if (!targetDate) return false;
  const diffDays = Math.round((new Date(today()) - new Date(targetDate)) / 864e5);
  return diffDays >= 60;
}

const calcSale = s => {
  const items = s.items && s.items.length ? s.items : [{qty: s.qty||1, cost: s.cost||0, price: s.price||0}];
  let cost = 0, rev = 0;
  items.forEach(it => {
    cost += (Number(it.cost)||0) * (Number(it.qty)||0);
    rev += (Number(it.price)||0) * (Number(it.qty)||0);
  });
  const paid = (s.pays||[]).reduce((a, p) => a + (Number(p.a)||0), 0);
  const rem = Math.round((rev - paid) * 100) / 100;
  const pct = rev ? Math.min(100, (paid / rev) * 100) : 100;
  return {cost, rev, paid, profit: rev - cost, rem, pct};
};

const calcPurchase = p => {
  const items = p.items && p.items.length ? p.items : [{qty: p.qty||1, price: p.price||0}];
  let total = 0;
  items.forEach(it => {
    total += (Number(it.price)||0) * (Number(it.qty)||0);
  });
  const paid = (p.pays||[]).reduce((a, x) => a + (Number(x.a)||0), 0);
  const rem = Math.round((total - paid) * 100) / 100;
  const pct = total ? Math.min(100, (paid / total) * 100) : 100;
  return {total, paid, rem, pct};
};

function duePill(due, rem, itemDate, label='Paid') {
  if (rem <= 0.009) return `<span class="pill">${label} ✓</span>`;
  if (isTwoMonthsOverdue(itemDate, due, rem)) {
    const overdueDays = Math.round((new Date(today()) - new Date(due || itemDate)) / 864e5);
    return `<span class="pill critical">🚨 ${overdueDays}d OVERDUE (2M+)</span>`;
  }
  if (!due) return `<span class="pill d">Unpaid</span>`;
  const n = daysTo(due);
  return n < 0 ? `<span class="pill d">${-n}d overdue</span>` : n <= 7 ? `<span class="pill w">due in ${n}d</span>` : `<span class="pill">due ${fd(due)}</span>`;
}

function tot(isSpecial = false) {
  const salesList = isSpecial ? (S.specialSales||[]) : (S.sales||[]);
  const purchasesList = isSpecial ? (S.specialPurchases||[]) : (S.purchases||[]);

  let t = {cost: 0, rev: 0, paid: 0, profit: 0, receivable: 0, purchasesTotal: 0, purchasesPaid: 0, payable: 0, over2mRec: 0, over2mPay: 0, count2mRec: 0, count2mPay: 0};
  salesList.forEach(s => {
    const c = calcSale(s);
    t.cost += c.cost;
    t.rev += c.rev;
    t.paid += c.paid;
    t.profit += c.profit;
    const unpaid = Math.max(0, c.rem);
    t.receivable += unpaid;
    if (isTwoMonthsOverdue(s.date, s.due, c.rem)) {
      t.over2mRec += unpaid;
      t.count2mRec++;
    }
  });
  purchasesList.forEach(p => {
    const cp = calcPurchase(p);
    t.purchasesTotal += cp.total;
    t.purchasesPaid += cp.paid;
    const unpaid = Math.max(0, cp.rem);
    t.payable += unpaid;
    if (isTwoMonthsOverdue(p.date, p.due, cp.rem)) {
      t.over2mPay += unpaid;
      t.count2mPay++;
    }
  });
  return t;
}

function render() {
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.t === tab));
  $('#cs').textContent = 'Currency: ' + S.cur;
  if (tab === 'home') $('#main').innerHTML = home();
  else if (tab === 'sales') $('#main').innerHTML = sales();
  else if (tab === 'purchases') $('#main').innerHTML = purchases();
  else if (tab === 'special') $('#main').innerHTML = specialSection();
  else $('#main').innerHTML = more();
}

function home() {
  const t = tot(false);
  const pendSales = (S.sales||[]).map(s => ({s, c: calcSale(s)})).filter(x => x.c.rem > 0.009).sort((a,b) => new Date(a.s.due||a.s.date) - new Date(b.s.due||b.s.date)).slice(0, 10);
  const pendPurchases = (S.purchases||[]).map(p => ({p, c: calcPurchase(p)})).filter(x => x.c.rem > 0.009).sort((a,b) => new Date(a.p.due||a.p.date) - new Date(b.p.due||b.p.date)).slice(0, 10);
  const hasCritical = (t.count2mRec > 0 || t.count2mPay > 0);

  return `
  ${hasCritical ? `
  <div class="card" style="border: 2px solid var(--rd); background: rgba(185,28,28,0.06); padding: 14px; margin-bottom: 12px;">
    <div class="row" style="margin-bottom:6px">
      <b style="color:var(--rd); font-size:14px">🚨 CRITICAL 2-MONTH (60d+) OVERDUE ALERT</b>
      <span class="pill critical">${t.count2mRec + t.count2mPay} Overdue</span>
    </div>
    <div class="two" style="font-size:13px; margin-top:8px">
      <div><b>Overdue Receivables:</b> <span class="r">${money(t.over2mRec)}</span> (${t.count2mRec} entries)</div>
      <div><b>Overdue Payables:</b> <span class="r">${money(t.over2mPay)}</span> (${t.count2mPay} entries)</div>
    </div>
  </div>
  ` : ''}

  <div class="grid">
    <div class="card" style="border-left: 4px solid var(--gd);">
      <div class="l">TO RECEIVE (RECEIVABLES)</div>
      <div class="v ${t.receivable>0?'a':'g'}">${money(t.receivable)}</div>
    </div>
    <div class="card" style="border-left: 4px solid var(--rd);">
      <div class="l">TO PAY (PAYABLES)</div>
      <div class="v ${t.payable>0?'r':'g'}">${money(t.payable)}</div>
    </div>
  </div>

  <div class="grid">
    <div class="card" style="border-top: 4px solid var(--ac)">
      <div class="l">TOTAL SALES</div>
      <div class="v">${money(t.rev)}</div>
    </div>
    <div class="card" style="border-top: 4px solid #475569">
      <div class="l">TOTAL PURCHASES</div>
      <div class="v">${money(t.purchasesTotal)}</div>
    </div>
  </div>

  <div class="card" style="border-left: 4px solid var(--ac); padding: 14px; margin-bottom: 14px;">
    <div class="l">TOTAL PROFIT (REGULAR)</div>
    <div class="v ${t.profit>=0?'g':'r'}" style="font-size:24px;">${money(t.profit)}</div>
  </div>

  <h2>Pending Customer Collections</h2>
  ${pendSales.length ? pendSales.map(x => rowSale(x.s, x.c, false)).join('') : '<div class="card empty" style="padding:16px">No pending customer collections 🎉</div>'}

  <h2>Pending Supplier Payments</h2>
  ${pendPurchases.length ? pendPurchases.map(x => rowPurchase(x.p, x.c, false)).join('') : '<div class="card empty" style="padding:16px">No pending supplier payments 🎉</div>'}
  
  <button class="btn s" onclick="exportXlsx()">⬇ Export All to Excel</button>`;
}

function getItemNamesSummary(items) {
  if (!items || !items.length) return 'No items recorded';
  return items.map(it => `${esc(it.name || 'Item')} (${it.qty} × ${money(it.price)})`).join(', ');
}

function rowSale(s, c, isSpecial = false) {
  const itemSummary = getItemNamesSummary(s.items);
  const typePill = s.type === 'Cash' ? '<span class="pill cash">Cash</span>' : '<span class="pill credit">Credit</span>';
  const specialPill = isSpecial ? '<span class="pill special">★ Special</span>' : '';
  const isCritical = isTwoMonthsOverdue(s.date, s.due, c.rem);
  const customerName = s.cust && s.cust.trim() ? esc(s.cust) : 'Walk-in Customer';

  return `<div class="card ${isCritical ? 'overdue-critical' : ''}" onclick="detailSale('${s.id}', ${isSpecial})">

function rowPurchase(p, c, isSpecial = false) {
  const itemSummary = getItemNamesSummary(p.items);
  const typePill = p.type === 'Cash' ? '<span class="pill cash">Cash</span>' : '<span class="pill credit">Credit</span>';
  const specialPill = isSpecial ? '<span class="pill special">★ Special</span>' : '';

  const supplierName = p.supplier && p.supplier.trim() ? esc(p.supplier) : 'Direct Supplier';

  return `<div class="card ${isCritical ? 'overdue-critical' : ''}" onclick="detailPurchase('${p.id}', ${isSpecial})">

  </div>`;

function renderGroupedList(items, isSale = true, isSpecial = false) {
  if (!items.length) return '<div class="empty">No entries found.</div>';
  const groups = {};
  items.forEach(it => {
    const d = it.date || 'Unknown';
    if (!groups[d]) groups[d] = [];
    groups[d].push(it);
  });

  const sortedDates = Object.keys(groups).sort((a,b) => new Date(b) - new Date(a));
  let html = '';
  sortedDates.forEach(dateStr => {
    const groupItems = groups[dateStr];
    let groupTotal = 0;
    groupItems.forEach(x => {
      const c = isSale ? calcSale(x) : calcPurchase(x);
      groupTotal += isSale ? c.rev : c.total;
    });

    const isToday = dateStr === today();
    const dateLabel = isToday ? 'Today · ' + fd(dateStr) : fd(dateStr);

    html += `
      <div class="date-header">
        <span>📅 ${dateLabel} (${groupItems.length})</span>
        <span>${money(groupTotal)}</span>
      </div>
    `;
    html += groupItems.map(item => isSale ? rowSale(item, calcSale(item), isSpecial) : rowPurchase(item, calcPurchase(item), isSpecial)).join('');
  });
  return html;
}

function saveSale(id, isSpecial = false) {

async function exportXlsx() {
  if (typeof XLSX === 'undefined') { alert('XLSX library could not load.'); return; }
  const wb = XLSX.utils.book_new();
  const t = tot(false);
  const st = tot(true);

  const sm = [
    ['Profit & Payables Tracker by Kisara Rajapaksha', ''],
    ['Exported On', today()],
    ['', ''],
    ['=== REGULAR BUSINESS ===', ''],
    ['TOTAL RECEIVABLES (To Receive)', t.receivable],
    ['TOTAL PAYABLES (To Settle)', t.payable],
    ['CRITICAL OVERDUE RECEIVABLES (2M+)', t.over2mRec],
    ['CRITICAL OVERDUE PAYABLES (2M+)', t.over2mPay],
    ['TOTAL SALES REVENUE', t.rev],
    ['TOTAL PURCHASES', t.purchasesTotal],
    ['TOTAL NET PROFIT', t.profit],
    ['', ''],
    ['=== SPECIAL SECTION (INDEPENDENT) ===', ''],
    ['SPECIAL RECEIVABLES', st.receivable],
    ['SPECIAL PAYABLES', st.payable],
    ['SPECIAL TOTAL SALES', st.rev],
    ['SPECIAL TOTAL PURCHASES', st.purchasesTotal],
    ['SPECIAL NET PROFIT', st.profit]
  ];
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(sm), 'Summary');

  function appendSalesSheet(sheetName, list) {
    const rows = [['Date', 'Invoice #', 'Type', 'Customer', 'Items Breakdown', 'Total Sale', 'Received', 'Receivable', 'Due Date', 'Status', 'Overdue 60d+']];
    (list||[]).forEach(s => {
      const c = calcSale(s);
      const itemStr = (s.items||[]).map(i => `${i.name} (x${i.qty})`).join(', ');
      const isCrit = isTwoMonthsOverdue(s.date, s.due, c.rem);
      rows.push([s.date, s.inv||'', s.type||'Credit', s.cust||'', itemStr, c.rev, c.paid, Math.max(0, c.rem), s.due||'-', c.rem <= 0.009 ? 'Paid' : 'Unpaid', isCrit ? 'YES' : 'NO']);
    });
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(rows), sheetName);
  }

  function appendPurchasesSheet(sheetName, list) {
    const rows = [['Date', 'Bill / Inv #', 'Type', 'Supplier', 'Items Breakdown', 'Total Purchase', 'Paid', 'Payable', 'Due Date', 'Status', 'Overdue 60d+']];
    (list||[]).forEach(p => {
      const c = calcPurchase(p);
      const itemStr = (p.items||[]).map(i => `${i.name} (x${i.qty})`).join(', ');
      const isCrit = isTwoMonthsOverdue(p.date, p.due, c.rem);
      rows.push([p.date, p.inv||'', p.type||'Credit', p.supplier||'', itemStr, c.total, c.paid, Math.max(0, c.rem), p.due||'-', c.rem <= 0.009 ? 'Paid' : 'Unpaid', isCrit ? 'YES' : 'NO']);
    });
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(rows), sheetName);
  }

  appendSalesSheet('Regular Sales', S.sales);
  appendPurchasesSheet('Regular Purchases', S.purchases);
  appendSalesSheet('Special Sales', S.specialSales);
  appendPurchasesSheet('Special Purchases', S.specialPurchases);

  const payRows = [['Scope', 'Entry Type', 'Date', 'Invoice / Bill #', 'Party', 'Amount', 'Payment Mode', 'Cheque / Remark']];
  (S.sales||[]).forEach(s => (s.pays||[]).forEach(p => payRows.push(['Regular', 'Sale Collection', p.d, s.inv||'', s.cust||'', p.a, p.method||'Cash', p.remark||''])));
  (S.purchases||[]).forEach(pr => (pr.pays||[]).forEach(p => payRows.push(['Regular', 'Supplier Payment', p.d, pr.inv||'', pr.supplier||'', p.a, p.method||'Cash', p.remark||''])));
  (S.specialSales||[]).forEach(s => (s.pays||[]).forEach(p => payRows.push(['Special', 'Special Sale Collection', p.d, s.inv||'', s.cust||'', p.a, p.method||'Cash', p.remark||''])));
  (S.specialPurchases||[]).forEach(pr => (pr.pays||[]).forEach(p => payRows.push(['Special', 'Special Supplier Payment', p.d, pr.inv||'', pr.supplier||'', p.a, p.method||'Cash', p.remark||''])));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(payRows), 'Payment Log');

  const buf = XLSX.write(wb, {type: 'array', bookType: 'xlsx'});
  const blob = new Blob([buf], {type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `Profit-Tracker-${today()}.xlsx`;
  document.body.appendChild(a);
  a.click();
  a.remove();
}

document.querySelectorAll('nav button').forEach(b => b.onclick = () => { 
  tab = b.dataset.t; 
  render(); 
  if (tab === 'special') renderSpecialList();
  $('#main').scrollTop = 0; 
});
$('#cs').onclick = () => { tab = 'more'; render(); };

applyTheme(S.theme);
updateDatalists();
initFirebaseSync();
render();
</script>
</body>
</html>
